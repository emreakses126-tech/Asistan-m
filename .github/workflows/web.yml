name: Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Zip var mi
        id: z
        run: if ls web*.zip >/dev/null 2>&1; then echo "var=1" >> $GITHUB_OUTPUT; fi
      - if: steps.z.outputs.var == '1'
        run: |
          mkdir -p site
          for z in $(ls web*.zip | LC_ALL=C sort); do unzip -o "$z" -d site; done
          if [ -f ayar.js ]; then cp ayar.js site/ayar.js; fi
          ls site
      - if: steps.z.outputs.var == '1'
        uses: actions/configure-pages@v5
      - if: steps.z.outputs.var == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - if: steps.z.outputs.var == '1'
        id: yayin
        uses: actions/deploy-pages@v4
