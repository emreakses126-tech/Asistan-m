name: Web
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Paketleri bul
        id: z
        run: |
          # Depodaki tüm zip'ler (adı ve klasörü ne olursa olsun) içeriğine göre ayrılır, yüklenme sırasına göre açılır.
          : > liste
          git -c core.quotepath=off ls-files -z -- '*.zip' | while IFS= read -r -d '' f; do
            if unzip -Z1 "$f" 2>/dev/null | grep -qx 'index.html'; then
              t=$(git log --diff-filter=A --format=%ct -1 -- "$f"); echo "${t:-0}	$f" >> liste
            fi
          done
          LC_ALL=C sort -t$'\t' -k1,1n -k2,2 liste > sirali
          cat sirali
          if [ -s sirali ]; then echo "var=1" >> $GITHUB_OUTPUT; fi
      - if: steps.z.outputs.var == '1'
        run: |
          mkdir -p site
          cut -f2- sirali | while IFS= read -r f; do unzip -o -q "$f" -d site; done
          if [ -f ayar.js ]; then cp ayar.js site/ayar.js; fi
          ls site
      - if: steps.z.outputs.var == '1'
        uses: actions/configure-pages@v5
      - if: steps.z.outputs.var == '1'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - if: steps.z.outputs.var == '1'
        id: yayin
        uses: actions/deploy-pages@v5
