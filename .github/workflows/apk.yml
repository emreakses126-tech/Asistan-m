name: APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip var mi
        id: z
        run: if ls MuhasebeAsistani-Android*.zip >/dev/null 2>&1; then echo "var=1" >> $GITHUB_OUTPUT; fi
      - if: steps.z.outputs.var == '1'
        run: for z in MuhasebeAsistani-Android*.zip; do unzip -o "$z" -d proje; done
      - if: steps.z.outputs.var == '1'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - if: steps.z.outputs.var == '1'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - if: steps.z.outputs.var == '1'
        run: cd proje && gradle assembleDebug --no-daemon --stacktrace
      - if: steps.z.outputs.var == '1'
        run: cp proje/app/build/outputs/apk/debug/app-debug.apk MuhasebeAsistani.apk
      - if: steps.z.outputs.var == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Muhasebe Asistanı ${{ github.run_number }}
          body: Telefonundan MuhasebeAsistani.apk dosyasına dokun, indir ve kur.
          files: MuhasebeAsistani.apk
